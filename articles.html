<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="瓜子 Blog 文章列表 — 所有文章都在这里，按发布时间倒序排列">
  <title>全部文章 — 瓜子 Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
  <div class="reading-progress"></div>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="logo-icon">🌻</span>
        瓜子 Blog
      </a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="articles.html">文章</a></li>
        <li><a href="tags.html">标签</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
      <button class="nav-toggle" aria-label="菜单" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <section class="page-header">
      <h1>📝 全部文章</h1>
      <p>共 <span id="article-count">0</span> 篇文章</p>
    </section>

    <div class="container">
      <!-- 搜索框 -->
      <div class="article-search">
        <input type="search" id="article-search" class="search-input"
               placeholder="搜索文章标题、摘要或标签..." aria-label="搜索文章">
      </div>

      <div class="article-list" id="article-list">
        <!-- JS 动态渲染 -->
      </div>

      <!-- 分页 -->
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-brand">🌻 瓜子 Blog</div>
      <p>记录思考，分享成长 &copy; 2026</p>
    </div>
  </footer>

  <button class="back-to-top" aria-label="回到顶部" title="回到顶部">↑</button>

  <!-- Scripts -->
  <script src="js/articles-data.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
  <script>
    const ARTICLES_PER_PAGE = 3;
    const searchInput = document.getElementById('article-search');
    let allArticles = [];
    let filteredArticles = [];
    let currentPage = 1;

    /**
     * 根据搜索关键词过滤文章（标题/摘要/标签，忽略大小写）
     */
    function applySearch() {
      const kw = searchInput.value.trim().toLowerCase();
      if (!kw) {
        filteredArticles = allArticles;
      } else {
        filteredArticles = allArticles.filter(a =>
          (a.title || '').toLowerCase().includes(kw) ||
          (a.summary || '').toLowerCase().includes(kw) ||
          (a.tags || []).some(t => t.toLowerCase().includes(kw))
        );
      }
      renderPage(1);
    }

    function renderPage(page) {
      currentPage = page;
      const totalPages = Math.max(1, Math.ceil(filteredArticles.length / ARTICLES_PER_PAGE));
      const start = (page - 1) * ARTICLES_PER_PAGE;
      const end = start + ARTICLES_PER_PAGE;
      const pageArticles = filteredArticles.slice(start, end);

      BlogRenderer.renderArticleCards(pageArticles, 'article-list');
      document.getElementById('article-count').textContent = filteredArticles.length;

      BlogRenderer.renderPagination(page, totalPages, 'pagination', (newPage) => {
        renderPage(newPage);
        window.scrollTo({ top: 200, behavior: 'smooth' });
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const { articles } = await BlogAPI.getArticles();
      allArticles = articles;
      filteredArticles = articles;
      renderPage(1);

      searchInput.addEventListener('input', applySearch);
    });
  </script>
</body>
</html>
