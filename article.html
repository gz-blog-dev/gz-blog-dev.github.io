<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="文章详情">
  <title>文章 — 瓜子 Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Marked.js — Markdown 渲染 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
  <!-- Highlight.js — 代码高亮 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
  <div class="reading-progress"></div>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="logo-icon">🌻</span>
        瓜子 Blog
      </a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="articles.html">文章</a></li>
        <li><a href="tags.html">标签</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
      <button class="nav-toggle" aria-label="菜单" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <div class="container-narrow" id="article-detail">
      <div class="article-loading">
        <div class="loading-spinner"></div>
        <p>加载中...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-brand">🌻 瓜子 Blog</div>
      <p>记录思考，分享成长 &copy; 2026</p>
    </div>
  </footer>

  <button class="back-to-top" aria-label="回到顶部" title="回到顶部">↑</button>

  <!-- Scripts -->
  <script src="js/articles-data.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const articleId = params.get('id');

      // 没有 id 参数 → 直接 404
      if (!articleId) {
        showNotFound();
        return;
      }

      try {
        const data = await BlogAPI.getArticle(articleId);

        if (data && data.article) {
          document.title = `${data.article.title} — 瓜子 Blog`;

          const metaDesc = document.querySelector('meta[name="description"]');
          if (metaDesc) metaDesc.setAttribute('content', data.article.summary || '');

          renderer.renderArticleDetail(data.article, 'article-detail', data.prev, data.next);
          window.scrollTo(0, 0);
        } else {
          showNotFound();
        }
      } catch (err) {
        console.error('加载文章失败：', err);
        showNotFound();
      }
    });

    function showNotFound() {
      const container = document.getElementById('article-detail');
      document.title = '404 — 瓜子 Blog';
      container.innerHTML = `
        <div class="not-found">
          <h1>404</h1>
          <p>文章不存在或已被删除</p>
          <a href="index.html" class="tag tag-lg" style="font-size: 1rem; padding: 10px 24px;">返回首页</a>
        </div>
      `;
    }
  </script>
</body>
</html>
