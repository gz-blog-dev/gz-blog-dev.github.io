<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="瓜子 Blog 标签分类 — 按标签浏览文章">
  <title>标签分类 — 瓜子 Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
  <div class="reading-progress"></div>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="logo-icon">🌻</span>
        瓜子 Blog
      </a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="articles.html">文章</a></li>
        <li><a href="tags.html">标签</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
      <button class="nav-toggle" aria-label="菜单" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <section class="page-header">
      <h1>🏷️ 标签分类</h1>
      <p>按标签浏览你感兴趣的内容</p>
    </section>

    <div class="container">
      <!-- 标签云 -->
      <div class="tag-cloud" id="tag-cloud">
        <!-- JS 动态渲染 -->
      </div>

      <!-- 筛选信息 -->
      <div class="tag-filter-info" id="filter-info">
        当前筛选：<strong id="filter-tag-name"></strong>
        <span class="clear-filter" id="clear-filter">清除筛选</span>
      </div>

      <!-- 筛选结果 -->
      <div class="article-list" id="filtered-articles">
        <!-- JS 动态渲染 -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-brand">🌻 瓜子 Blog</div>
      <p>记录思考，分享成长 &copy; 2026</p>
    </div>
  </footer>

  <button class="back-to-top" aria-label="回到顶部" title="回到顶部">↑</button>

  <!-- Scripts -->
  <script src="js/articles-data.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
  <script>
    let allTags = [];
    let activeTag = null;

    function updateTagCloud(selectedTag) {
      const container = document.getElementById('tag-cloud');
      if (!container) return;

      const maxCount = Math.max(...allTags.map(t => t.count), 1);
      const minCount = Math.min(...allTags.map(t => t.count), 1);

      const html = allTags.map(({ name, count }) => {
        const ratio = maxCount === minCount ? 0.5 : (count - minCount) / (maxCount - minCount);
        let sizeClass = 'tag-sm';
        if (ratio > 0.75) sizeClass = 'tag-xl';
        else if (ratio > 0.5) sizeClass = 'tag-lg';
        else if (ratio > 0.25) sizeClass = 'tag-md';

        const isActive = name === selectedTag ? ' active' : '';
        return `<span class="tag ${sizeClass}${isActive}" data-tag="${name}" title="${count} 篇文章">
          ${name} (${count})
        </span>`;
      }).join('');

      container.innerHTML = html;

      container.querySelectorAll('.tag').forEach(tagEl => {
        tagEl.addEventListener('click', () => {
          const tag = tagEl.dataset.tag;
          activeTag = activeTag === tag ? null : tag;
          filterArticles(activeTag);
        });
      });
    }

    async function filterArticles(tag) {
      const { articles } = await BlogAPI.getArticles({ tag: tag || undefined });
      const filterInfo = document.getElementById('filter-info');
      const filterTagName = document.getElementById('filter-tag-name');

      if (tag) {
        filterInfo.classList.add('show');
        filterTagName.textContent = tag;
      } else {
        filterInfo.classList.remove('show');
      }

      BlogRenderer.renderArticleCards(articles, 'filtered-articles');
      updateTagCloud(tag);

      if (tag) {
        history.replaceState(null, '', `?tag=${encodeURIComponent(tag)}`);
      } else {
        history.replaceState(null, '', window.location.pathname);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const { tags } = await BlogAPI.getTags();
      allTags = tags;

      const params = new URLSearchParams(window.location.search);
      const urlTag = params.get('tag');

      updateTagCloud(urlTag || null);

      if (urlTag) {
        activeTag = urlTag;
        filterArticles(urlTag);
      } else {
        filterArticles(null);
      }

      document.getElementById('clear-filter').addEventListener('click', () => {
        activeTag = null;
        filterArticles(null);
      });
    });
  </script>
</body>
</html>
